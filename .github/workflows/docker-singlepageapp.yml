name: Docker SinglePageApp

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: DOCKER_HUB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log into docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: janmbaco/singlepageapp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the release image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/facades/Dockerfile
          pull: true
          platforms: linux/amd64
          outputs: type=image,name=janmbaco/singlepageapp,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the runtime image
        env:
          IMAGE: janmbaco/singlepageapp@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/spa-site"
          echo 'image smoke test' > "$RUNNER_TEMP/spa-site/index.html"
          container=$(docker run -d -p 127.0.0.1::8080 -v "$RUNNER_TEMP/spa-site:/app/static:ro" "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl -fsS --retry 10 --retry-connrefused "http://$address/" -o "$RUNNER_TEMP/spa-response"
          cmp "$RUNNER_TEMP/spa-site/index.html" "$RUNNER_TEMP/spa-response"

      - name: Check the published runtime packages with Docker Scout
        uses: docker/scout-action@b265cd48f8a1451d2680815b3e8dc4ed65ee16e7 # v1.30.0
        with:
          command: quickview,cves
          image: registry://janmbaco/singlepageapp@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          only-package-types: apk
          only-fixed: true
          exit-code: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the verified image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mapfile -t tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "janmbaco/singlepageapp@$DIGEST"
